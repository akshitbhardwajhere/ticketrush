services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: ticketrush
    ports: ["5441:5432"]
    # Named volume: data persists across `docker compose up/down`.
    # Only `docker compose down -v` or `docker volume rm` will erase it.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketrush"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6331:6379"]
    # Named volume: rate-limit buckets and queue state survive restarts.
    volumes:
      - redisdata:/data
    # Persist to disk so data survives a container restart (not just in-memory)
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16
    environment:
      PGPASSWORD: pass
    volumes:
      - ./schema.sql:/migrations/001_schema.sql:ro
      - ./migrations:/migrations/incremental:ro
    depends_on:
      db:
        condition: service_healthy   # wait for real readiness, not just port-open
    command: >-
      sh -c "
      psql -h db -U postgres -d ticketrush -f /migrations/001_schema.sql;
      for migration in /migrations/incremental/*.sql; do
        psql -h db -U postgres -d ticketrush -f \"$$migration\";
      done"

  api-1:
    build: .
    environment: &api-env
      DATABASE_URL: postgres://postgres:pass@db:5432/ticketrush
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-inr}
      QUEUE_GATE: ${QUEUE_GATE:-off}
      ADMIT_PER_TICK: ${ADMIT_PER_TICK:-20}
      PASS_TTL_SEC: ${PASS_TTL_SEC:-120}
      PORT: 3000
      INSTANCE_ID: api-1
      # Cookie settings (COOKIE_SECURE=true required when TLS is active)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me-in-production}
      # Auth rate-limit tuning
      AUTH_IP_CAPACITY: ${AUTH_IP_CAPACITY:-10}
      AUTH_IP_REFILL: ${AUTH_IP_REFILL:-0.1}
      AUTH_EMAIL_CAPACITY: ${AUTH_EMAIL_CAPACITY:-5}
      AUTH_EMAIL_REFILL: ${AUTH_EMAIL_REFILL:-0.033}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api-2:
    build: .
    environment:
      <<: *api-env
      INSTANCE_ID: api-2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api-3:
    build: .
    environment:
      <<: *api-env
      INSTANCE_ID: api-3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  load-balancer:
    image: haproxy:3.0
    ports: ["${API_HTTP_PORT:-3000}:3000", "${HAPROXY_STATS_PORT:-8404}:8404"]
    volumes: ["./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    depends_on: [api-1, api-2, api-3]

# Named volumes — only destroyed by `docker compose down -v`
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
