defaults
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s
frontend api
  bind *:3000
  default_backend ticket_api
backend ticket_api
  balance roundrobin
  option httpchk GET /health
  server api-1 api-1:3000 check
  server api-2 api-2:3000 check
  server api-3 api-3:3000 check
listen stats
  bind *:8404
  stats enable
  stats uri /stats
