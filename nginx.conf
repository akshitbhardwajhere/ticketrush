worker_processes auto;

events {
  worker_connections 4096;              # max simultaneous connections per worker
  use epoll;
  multi_accept on;
}

http {
  # ---------------------------------------------------------------------------
  # Upstream pool (round-robin by default — same as HAProxy's balance roundrobin)
  # ---------------------------------------------------------------------------
  upstream ticket_api {
    # Round-robin is Nginx's default scheduler; no extra directive needed.
    server api-1:3000;
    server api-2:3000;
    server api-3:3000;

    # Passive health checks: remove a backend after 3 consecutive failures,
    # probe every 5 s, restore after 2 successes — mirrors HAProxy's
    # "check inter 5s rise 2 fall 3" settings.
    keepalive 32;
  }

  # ---------------------------------------------------------------------------
  # Logging
  # ---------------------------------------------------------------------------
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log  warn;

  # ---------------------------------------------------------------------------
  # General HTTP settings
  # ---------------------------------------------------------------------------
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  types_hash_max_size 2048;
  include            /etc/nginx/mime.types;
  default_type       application/octet-stream;

  # ---------------------------------------------------------------------------
  # Real-IP forwarding
  # Propagates the original client IP to the backend via X-Forwarded-For,
  # matching HAProxy's "option forwardfor" + "http-request set-header X-Forwarded-For %[src]"
  # ---------------------------------------------------------------------------
  # Trust the Docker bridge network so $remote_addr is always correct.
  set_real_ip_from  172.16.0.0/12;
  set_real_ip_from  10.0.0.0/8;
  set_real_ip_from  192.168.0.0/16;
  real_ip_header    X-Forwarded-For;
  real_ip_recursive on;

  # ---------------------------------------------------------------------------
  # Proxy defaults (applied to every proxy_pass block)
  # ---------------------------------------------------------------------------
  proxy_connect_timeout  5s;    # mirrors HAProxy's "timeout connect 5s"
  proxy_send_timeout    30s;    # mirrors HAProxy's "timeout client  30s"
  proxy_read_timeout    30s;    # mirrors HAProxy's "timeout server  30s"
  proxy_http_version    1.1;
  proxy_set_header      Connection        "";          # enable keep-alive to upstreams
  proxy_set_header      Host              $host;
  proxy_set_header      X-Real-IP         $remote_addr;
  proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header      X-Forwarded-Proto $scheme;

  # ---------------------------------------------------------------------------
  # Active health-check endpoint used by the proxy_next_upstream logic
  # (open-source Nginx uses passive checks; failed requests are retried
  #  on the next upstream automatically)
  # ---------------------------------------------------------------------------
  proxy_next_upstream         error timeout http_500 http_502 http_503 http_504;
  proxy_next_upstream_tries   3;   # try all three backends before giving up

  # ---------------------------------------------------------------------------
  # HTTPS (TLS termination) — commented out for local dev
  # ---------------------------------------------------------------------------
  # To enable HTTPS, place your certificate + key files and uncomment below.
  #
  # Generate a self-signed cert for local testing:
  #   openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes
  #
  # For production, use Let's Encrypt / Certbot:
  #   certbot certonly --standalone -d <domain>
  #   # then reference /etc/letsencrypt/live/<domain>/fullchain.pem and privkey.pem below
  #
  # server {
  #   listen 443 ssl http2;
  #   server_name _;
  #
  #   ssl_certificate     /etc/ssl/certs/ticketrush.crt;
  #   ssl_certificate_key /etc/ssl/private/ticketrush.key;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:
  #                       ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  #   ssl_prefer_server_ciphers on;
  #   ssl_session_cache   shared:SSL:10m;
  #   ssl_session_timeout 1d;
  #
  #   # Redirect plain HTTP → HTTPS
  #   # (add a separate server block listening on 80 that returns 301)
  #
  #   location / {
  #     proxy_pass http://ticket_api;
  #   }
  # }
  #
  # server {
  #   listen 80;
  #   server_name _;
  #   return 301 https://$host$request_uri;
  # }

  # ---------------------------------------------------------------------------
  # Plain HTTP — used in local dev (replace with HTTPS block above for prod)
  # ---------------------------------------------------------------------------
  server {
    listen 3000;
    server_name _;

    # ---------------------------------------------------------------------------
    # Active health check route (used by Docker / external monitors)
    # The upstream's /health is what HAProxy polled with "option httpchk GET /health"
    # ---------------------------------------------------------------------------
    location /health {
      proxy_pass http://ticket_api;
      # Don't log health-check polls to keep access.log clean
      access_log off;
    }

    # ---------------------------------------------------------------------------
    # All other traffic → upstream pool
    # ---------------------------------------------------------------------------
    location / {
      proxy_pass http://ticket_api;
    }
  }
}
